name: Nightly iOS Build

on:
  schedule:
    # Runs at 3 AM EST (8 AM UTC) - off-peak hours for shorter queue
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          expo-cache: false
          eas-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build iOS and Submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit
